<!DOCTYPE html>
<html>
<head>
  <title>CRUD App</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 20px;
    }

    h2 {
      color: #333;
    }

    input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .add-btn {
      background: #28a745;
      color: white;
    }

    .update-btn {
      background: #007bff;
      color: white;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .edit-btn {
      background: #ffc107;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<h2>User Form</h2>

<input id="name" placeholder="Name">
<input id="age" placeholder="Age">

<button class="add-btn" onclick="addUser()">Add</button>
<button class="update-btn" onclick="updateUser()">Update</button>

<h2>Users</h2>
<ul id="list"></ul>

<script src="script.js"></script>

</body>
</html>
