<!DOCTYPE html>
<html>
<head>
    <title>TypeScript Looping & Branching</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #9face6);
            text-align: center;
            margin-top: 50px;
        }

        h2 {
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input, select {
            padding: 8px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #222;
            font-weight: bold;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            margin: auto;
            box-shadow: 0px 0px 10px gray;
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>Looping & Branching Application</h2>

        <label>Enter Number:</label><br>
        <input type="number" id="num"><br>

        <label>Select Choice:</label><br>
        <select id="choice">
            <option value="1">Even Series (for loop)</option>
            <option value="2">Fibonacci Series (while loop)</option>
            <option value="3">Strong Number (do...while)</option>
        </select><br>

        <button onclick="process()">Submit</button>

        <h3>Output:</h3>
        <p id="result"></p>
    </div>

    <script src="app.js"></script>

</body>
</html>
