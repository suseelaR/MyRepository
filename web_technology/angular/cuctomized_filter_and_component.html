<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Custom Filter and Component in AngularJS</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#141e30,#243b55);
            min-height:100vh;
            padding:30px;
            color:white;
        }

        .container{
            width:80%;
            margin:auto;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            font-size:40px;
        }

        .subtitle{
            text-align:center;
            margin-bottom:35px;
            color:#cbd5e1;
        }

        .card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            padding:25px;
            border-radius:18px;
            margin-bottom:25px;
            box-shadow:0 8px 20px rgba(0,0,0,0.25);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        h2{
            color:#00e5ff;
            margin-bottom:15px;
        }

        .result{
            font-size:22px;
            color:#00ff95;
            font-weight:bold;
            margin-top:10px;
        }

        .student-box{
            background:linear-gradient(90deg,#ff9a00,#ff0058);
            padding:15px;
            border-radius:12px;
            margin-top:15px;
            font-size:18px;
        }

        hr{
            border:none;
            border-top:1px solid rgba(255,255,255,0.2);
            margin:20px 0;
        }
    </style>

    <script>
        var app = angular.module("myApp", []);

        // Custom Filter
        app.filter("reverseText", function () {
            return function (input) {
                return input.split("").reverse().join("");
            };
        });

        // Custom Component
        app.component("studentInfo", {
            template: `
                <div class="student-box">
                    <p><b>Name:</b> {{$ctrl.name}}</p>
                    <p><b>Course:</b> {{$ctrl.course}}</p>
                    <p><b>College:</b> {{$ctrl.college}}</p>
                </div>
            `,
            controller: function () {
                this.name = "Suseela";
                this.course = "MCA";
                this.college = "ABC College";
            }
        });

        app.controller("myCtrl", function ($scope) {
            $scope.message = "AngularJS";
        });
    </script>
</head>

<body ng-controller="myCtrl">

<div class="container">

    
    <p class="subtitle">Custom Filter and Custom Component Demonstration</p>

    <div class="card">
        <h2>Custom Filter Example</h2>
        <p>Original Text: {{message}}</p>
        <p class="result">Reversed Text: {{message | reverseText}}</p>
    </div>

    <div class="card">
        <h2>Custom Component Example</h2>
        <student-info></student-info>
    </div>

</div>

</body>
</html>
