<!DOCTYPE html>
<html>
<head>
    <title>Rating Page</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
body
{
    font-family: Arial;
    background:#89CFF0;
    padding:20px;
    color:#e67e22;         
}
h1
{
    text-align:center;
    margin-bottom:20px;
    color:#e67e22;         
}
.container
{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.product{
    background:#F0FFFF;
    width:180px;
    padding:12px;
    border:1px solid #dcdde1;
    text-align:center;
    border-radius:6px;
}
.product img{
    width:100%;
    height:180px;
}
.star
{
    font-size:35px;
    cursor:pointer;
    color:#bdc3c7;          
}
.star.filled
{
    color:#f39c12;          
}

.rating
{
    margin-top:6px;
    font-weight:bold;
    font-size:14px;
    color:#e67e22;          
}
</style>
</head>

<body>

<h1>BUS RATING</h1>

<div class="container">

    <div class="product">
        <img src="D:\suseela\bus1.jpg">
        <div class="stars">
            <span class="star" data-value="1">&#9733;</span>
            <span class="star" data-value="2">&#9733;</span>
            <span class="star" data-value="3">&#9733;</span>
            <span class="star" data-value="4">&#9733;</span>
            <span class="star" data-value="5">&#9733;</span>
        </div>
        <div class="rating">No rating</div>
    </div>

       <div class="product">
        <img src="D:\suseela\bus6.jpg">
        <div class="stars">
            <span class="star" data-value="1">&#9733;</span>
            <span class="star" data-value="2">&#9733;</span>
            <span class="star" data-value="3">&#9733;</span>
            <span class="star" data-value="4">&#9733;</span>
            <span class="star" data-value="5">&#9733;</span>
        </div>
        <div class="rating">No rating</div>
    </div>

       <div class="product">
        <img src="D:\suseela\bus7.jpg">
        <div class="stars">
            <span class="star" data-value="1">&#9733;</span>
            <span class="star" data-value="2">&#9733;</span>
            <span class="star" data-value="3">&#9733;</span>
            <span class="star" data-value="4">&#9733;</span>
            <span class="star" data-value="5">&#9733;</span>
        </div>
        <div class="rating">No rating</div>
    </div>

       <div class="product">
        <img src="D:\suseela\bus8.jpg">
        <div class="stars">
            <span class="star" data-value="1">&#9733;</span>
            <span class="star" data-value="2">&#9733;</span>
            <span class="star" data-value="3">&#9733;</span>
            <span class="star" data-value="4">&#9733;</span>
            <span class="star" data-value="5">&#9733;</span>
        </div>
        <div class="rating">No rating</div>
    </div>

       <div class="product">
        <img src="D:\suseela\bus5.jpeg">
        <div class="stars">
            <span class="star" data-value="1">&#9733;</span>
            <span class="star" data-value="2">&#9733;</span>
            <span class="star" data-value="3">&#9733;</span>
            <span class="star" data-value="4">&#9733;</span>
            <span class="star" data-value="5">&#9733;</span>
        </div>
        <div class="rating">No rating</div>
    </div>
</div>

<script>

$(".star").click(function(){

    var rating = $(this).data("value");   // star number clicked
    var stars = $(this).parent().children(".star");
    var text = $(this).parent().siblings(".rating");

    for(var i = 0; i < stars.length; i++){
        if($(stars[i]).data("value") <= rating){
            $(stars[i]).addClass("filled");
        }else{
            $(stars[i]).removeClass("filled");
        }
    }

    text.text("Rated: " + rating + " / 5");
});
</script>

</body>
</html>
